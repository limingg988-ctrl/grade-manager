<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成績管理</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1><i class="ti ti-chart-bar"></i> 成績管理</h1>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="dashboard">ダッシュボード</button>
      <button class="tab" data-tab="grades">成績一覧</button>
      <button class="tab" data-tab="add">成績を追加</button>
    </nav>

    <!-- ダッシュボード -->
    <div id="tab-dashboard" class="tab-content">
      <div class="grid4" id="metrics"></div>
      <div class="grid2">
        <div class="card">
          <h2 class="section-title">科目別平均点</h2>
          <div class="chart-wrap"><canvas id="subjectChart"></canvas></div>
        </div>
        <div class="card">
          <h2 class="section-title">点数推移</h2>
          <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
        </div>
      </div>
      <div class="card">
        <h2 class="section-title">最近の成績</h2>
        <div id="recent-items"></div>
      </div>
    </div>

    <!-- 成績一覧 -->
    <div id="tab-grades" class="tab-content hidden">
      <div class="card">
        <div class="row" style="margin-bottom:1rem">
          <select id="filter-subject">
            <option value="">すべての科目</option>
          </select>
          <select id="filter-sort">
            <option value="date-desc">日付（新しい順）</option>
            <option value="date-asc">日付（古い順）</option>
            <option value="score-desc">点数（高い順）</option>
            <option value="score-asc">点数（低い順）</option>
          </select>
        </div>
        <div id="grade-list"></div>
      </div>
    </div>

    <!-- 成績を追加 -->
    <div id="tab-add" class="tab-content hidden">
      <div class="card form-card">
        <h2 class="section-title">成績を追加</h2>
        <div class="form-group">
          <label>科目名</label>
          <select id="subject-select">
            <option value="">-- 選択または下に新規入力 --</option>
          </select>
          <input type="text" id="subject-new" placeholder="新しい科目名を入力" style="margin-top:6px" />
        </div>
        <div class="grid2">
          <div class="form-group">
            <label>点数</label>
            <input type="number" id="score" placeholder="例: 85" min="0" />
          </div>
          <div class="form-group">
            <label>満点</label>
            <input type="number" id="max-score" placeholder="例: 100" value="100" min="1" />
          </div>
        </div>
        <div class="grid2">
          <div class="form-group">
            <label>目標点数</label>
            <input type="number" id="target" placeholder="例: 80" />
          </div>
          <div class="form-group">
            <label>日付</label>
            <input type="date" id="date" />
          </div>
        </div>
        <div class="form-group">
          <label>試験種別</label>
          <select id="exam-type">
            <option>中間テスト</option>
            <option>期末テスト</option>
            <option>小テスト</option>
            <option>課題・レポート</option>
            <option>実技</option>
            <option>その他</option>
          </select>
        </div>
        <div class="form-group">
          <label>メモ</label>
          <textarea id="memo" rows="2" placeholder="気づきなど自由に"></textarea>
        </div>
        <button id="add-btn" class="btn btn-primary">
          <i class="ti ti-check"></i> 追加する
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
